<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Terminal | Lenny Bos</title>
    <link rel="icon" href="./favicon.ico?v=apple" sizes="16x16 32x32 48x48" />
    <meta
      name="description"
      content="Explore Lenny Bos’s cybersecurity portfolio through an interactive terminal."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./portfolio.css?v=koth" />
    <link rel="stylesheet" href="./backdrop.css?v=fox-cross-card" />
    <link rel="stylesheet" href="./terminal.css?v=compact-lines" />
    <link rel="preload" href="./media/yodapixel.webp" as="image" />
    <link rel="preload" href="./media/yoda-looking-right.png" as="image" />
    <link rel="preload" href="./media/yoda-wave.png" as="image" />
  </head>
  <body class="page-terminal">
    <div class="portfolio-backdrop" aria-hidden="true"><canvas data-scene="backdrop" data-panorama></canvas></div>
    <nav class="site-actions terminal-actions" aria-label="Portfolio controls">
      <a class="button button--secondary page-switch" href="./index.html">
        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true" focusable="false">
          <rect x="2.5" y="3.75" width="15" height="12.5" rx="2" stroke="currentColor" stroke-width="1.5" />
          <path d="M3 7h14" stroke="currentColor" stroke-width="1.5" />
        </svg>
        Classic view
      </a>
      <button class="theme-toggle" type="button" title="Switch color theme" aria-label="Enable light mode" aria-pressed="true">
        <span class="theme-toggle__icon" aria-hidden="true">☀</span>
        <span class="theme-toggle__icon" aria-hidden="true">☾</span>
      </button>
    </nav>

    <main class="site-main terminal-stage terminal-stage--booting" aria-labelledby="terminal-title">
      <div class="terminal-intro">
        <h1 id="terminal-title">Terminal.</h1>
        <p>Explore Lenny Bos’s work from the command line.</p>
      </div>
      <aside class="yoda-guide yoda-guide--booting" aria-label="Terminal helper">
        <div class="yoda-guide__speech"><div class="yoda-guide__text" id="yodaSpeech" role="status" aria-live="polite"></div></div>
        <div class="yoda-guide__media">
          <img class="yoda-guide__image" id="yodaImage" src="./media/sleeping-yoda.png" alt="Sleeping pixel art Yoda" />
          <video
            class="yoda-guide__video"
            id="yodaVideo"
            src="./media/yoda-talking.mp4"
            muted
            playsinline
            preload="metadata"
            aria-hidden="true"
          ></video>
          <canvas class="yoda-guide__canvas" id="yodaCanvas" aria-hidden="true"></canvas>
        </div>
      </aside>

      <div class="shell" aria-label="Terminal portfolio">
      <header class="shell__topbar">
        <a class="dot dot--red dot--close" href="./index.html" aria-label="Close terminal and open classic view" title="Open classic view"></a>
        <span class="dot dot--yellow" aria-hidden="true"></span>
        <span class="dot dot--green" aria-hidden="true"></span>
        <span class="shell__title">lenny.bos / tty1</span>
      </header>

      <section class="shell__screen" id="screen" role="region" aria-label="Terminal output" aria-live="polite">
        <div class="output" id="output"></div>

        <form class="input input--booting" id="inputForm" autocomplete="off">
          <span class="prompt" id="prompt" aria-hidden="true">guest@lenny.bos:~$</span>
          <label class="sr-only" for="commandInput">Command</label>
          <input
            id="commandInput"
            class="input__field"
            type="text"
            inputmode="text"
            spellcheck="false"
            autocapitalize="off"
            autocomplete="off"
            disabled
          />
        </form>
      </section>

      <nav class="mobile-commands" aria-label="Quick terminal commands">
        <span class="mobile-commands__label">Quick commands</span>
        <div class="mobile-commands__list">
          <button type="button" data-command="about">about</button>
          <button type="button" data-command="projects">projects</button>
          <button type="button" data-command="cat about/skills.txt">cat skills.txt</button>
          <button type="button" data-command="contact">contact</button>
        </div>
      </nav>

      <footer class="shell__hint" aria-hidden="true">
        Start with <span class="kbd">help</span>, <span class="kbd">about</span>, or
        <span class="kbd">projects</span>
      </footer>
      </div>
    </main>

    <script src="./theme.js?v=terminal-forest" defer></script>
    <script src="./scenes.js?v=full-forest" defer></script>
    <script src="./app.js?v=project-references" defer></script>
  </body>
</html>
